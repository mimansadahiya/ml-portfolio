<svg viewBox="0 0 760 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Stock Analyst system architecture: user input to data fetcher, deterministic quant modules and seven qualitative agents in parallel, then synthesis and report">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8178"/>
    </marker>
  </defs>

  <!-- User -->
  <rect x="320" y="20" width="120" height="46" rx="10" fill="#2b2621" stroke="#3a342d"/>
  <text x="380" y="47" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f3efea">User input</text>
  <line x1="380" y1="66" x2="380" y2="92" stroke="#8a8178" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Data fetcher -->
  <rect x="250" y="92" width="260" height="54" rx="10" fill="#2b2621" stroke="#7ba7d9" stroke-width="1.5"/>
  <text x="380" y="116" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#f3efea">Data fetcher</text>
  <text x="380" y="134" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">yfinance · prices · statements · profile</text>

  <!-- Split -->
  <line x1="380" y1="146" x2="380" y2="164" stroke="#8a8178" stroke-width="1.5"/>
  <line x1="205" y1="164" x2="555" y2="164" stroke="#8a8178" stroke-width="1.5"/>
  <line x1="205" y1="164" x2="205" y2="178" stroke="#8a8178" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="555" y1="164" x2="555" y2="178" stroke="#8a8178" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Column headers -->
  <text x="205" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1" fill="#7fc49a">DETERMINISTIC QUANT</text>
  <text x="555" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1" fill="#d98a6e">QUALITATIVE AGENTS</text>

  <!-- Left column: quant -->
  <rect x="60" y="210" width="290" height="56" rx="10" fill="#2b2621" stroke="#7fc49a" stroke-width="1.5"/>
  <text x="205" y="235" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#f3efea">Metrics</text>
  <text x="205" y="253" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#b6ada2">ratios · SMA/EMA · RSI · MACD</text>

  <rect x="60" y="284" width="290" height="56" rx="10" fill="#2b2621" stroke="#7fc49a" stroke-width="1.5"/>
  <text x="205" y="309" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#f3efea">Valuation</text>
  <text x="205" y="327" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#b6ada2">DCF · CAPM/WACC · P/E multiples · Graham</text>

  <rect x="60" y="358" width="290" height="56" rx="10" fill="#2b2621" stroke="#7fc49a" stroke-width="1.5"/>
  <text x="205" y="383" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#f3efea">Risk</text>
  <text x="205" y="401" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10.5" fill="#b6ada2">volatility · VaR · beta · max drawdown</text>

  <!-- Right column: 7 agents -->
  <rect x="410" y="210" width="290" height="204" rx="10" fill="#2b2621" stroke="#d98a6e" stroke-width="1.5"/>
  <text x="555" y="233" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#f3efea">Seven research agents</text>
  <text x="555" y="249" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#b6ada2">gemini-2.5-flash · search grounded</text>
  <g font-family="Inter, sans-serif" font-size="12.5" fill="#e8e2da">
    <text x="430" y="274">Company overview</text>
    <text x="430" y="296">Macro outlook</text>
    <text x="430" y="318">Competitive landscape</text>
    <text x="430" y="340">News &amp; sentiment</text>
    <text x="430" y="362">Industry analysis</text>
    <text x="430" y="384">Financial performance</text>
    <text x="430" y="406">Major risks</text>
  </g>

  <!-- Merge -->
  <line x1="205" y1="414" x2="205" y2="436" stroke="#8a8178" stroke-width="1.5"/>
  <line x1="555" y1="414" x2="555" y2="436" stroke="#8a8178" stroke-width="1.5"/>
  <line x1="205" y1="436" x2="555" y2="436" stroke="#8a8178" stroke-width="1.5"/>
  <line x1="380" y1="436" x2="380" y2="462" stroke="#8a8178" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Synthesis -->
  <rect x="250" y="462" width="260" height="52" rx="10" fill="#2b2621" stroke="#e0ab6d" stroke-width="1.5"/>
  <text x="380" y="485" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#f3efea">Synthesis agent</text>
  <text x="380" y="503" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">combines quant + qualitative</text>

  <line x1="380" y1="514" x2="380" y2="544" stroke="#8a8178" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Report -->
  <rect x="250" y="544" width="260" height="52" rx="10" fill="#2b2621" stroke="#7fc49a" stroke-width="1.5"/>
  <text x="380" y="567" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#f3efea">Structured report</text>
  <text x="380" y="585" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">recommendation · target price · risk</text>
</svg>
