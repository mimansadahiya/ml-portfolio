<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Generic data pipeline: sources to unified data, features, clustering, segments, dashboard">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8178"/>
    </marker>
  </defs>

  <!-- Sources -->
  <g>
    <rect x="40" y="24" width="180" height="58" rx="10" fill="#2b2621" stroke="#3a342d"/>
    <text x="130" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#f3efea">Activity logs</text>
    <text x="130" y="69" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">interaction events</text>

    <rect x="270" y="24" width="180" height="58" rx="10" fill="#2b2621" stroke="#3a342d"/>
    <text x="360" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#f3efea">Contact tables</text>
    <text x="360" y="69" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">developer profiles</text>

    <rect x="500" y="24" width="180" height="58" rx="10" fill="#2b2621" stroke="#3a342d"/>
    <text x="590" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#f3efea">SDK downloads</text>
    <text x="590" y="69" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">adoption signals</text>
  </g>

  <g stroke="#8a8178" stroke-width="1.5" marker-end="url(#arr)">
    <line x1="130" y1="82" x2="310" y2="116"/>
    <line x1="360" y1="82" x2="360" y2="116"/>
    <line x1="590" y1="82" x2="410" y2="116"/>
  </g>

  <rect x="170" y="116" width="380" height="58" rx="10" fill="#2b2621" stroke="#d98a6e" stroke-width="1.5"/>
  <text x="360" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#f3efea">Unify &amp; clean</text>
  <text x="360" y="161" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">deduplicate · resolve identifiers · join across sources</text>

  <line x1="360" y1="174" x2="360" y2="208" stroke="#8a8178" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="170" y="208" width="380" height="58" rx="10" fill="#2b2621" stroke="#3a342d"/>
  <text x="360" y="234" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#f3efea">Feature engineering</text>
  <text x="360" y="253" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">engagement + time-based developer features</text>

  <line x1="360" y1="266" x2="360" y2="300" stroke="#8a8178" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="170" y="300" width="380" height="58" rx="10" fill="#2b2621" stroke="#3a342d"/>
  <text x="360" y="326" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#f3efea">Clustering</text>
  <text x="360" y="345" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">K-Means &amp; agglomerative · CH / Davies-Bouldin scores</text>

  <line x1="360" y1="358" x2="360" y2="392" stroke="#8a8178" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="170" y="392" width="380" height="58" rx="10" fill="#2b2621" stroke="#7fc49a" stroke-width="1.5"/>
  <text x="360" y="418" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#f3efea">Segmentation</text>
  <text x="360" y="437" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">four behavioral archetypes</text>

  <line x1="360" y1="450" x2="360" y2="484" stroke="#8a8178" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="170" y="484" width="380" height="58" rx="10" fill="#2b2621" stroke="#3a342d"/>
  <text x="360" y="510" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#f3efea">Dashboard</text>
  <text x="360" y="529" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#b6ada2">Streamlit developer-profile explorer</text>
</svg>
