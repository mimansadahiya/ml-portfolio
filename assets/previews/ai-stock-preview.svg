<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated preview of the AI Stock Investment Analyst dashboard">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8934a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#b8934a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .bg { fill: #211d19; }
      .panel { fill: #2b2621; stroke: #3a342d; }
      .lbl { font-family: Inter, sans-serif; fill: #b6ada2; }
      .val { font-family: JetBrains Mono, monospace; fill: #f3efea; }
      .accent { fill: #b8934a; }
      .tick { font-family: JetBrains Mono, monospace; fill: #e0ab6d; }

      @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes draw { from { stroke-dashoffset: 620; } to { stroke-dashoffset: 0; } }
      @keyframes fadeArea { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

      .kpi-1 { animation: fadeUp 9s infinite; }
      .kpi-2 { animation: fadeUp 9s infinite 0.5s; }
      .kpi-3 { animation: fadeUp 9s infinite 1s; }
      .line { stroke-dasharray: 620; animation: draw 4s infinite 1.2s ease-in-out; }
      .area { animation: fadeArea 4s infinite 2.2s ease-in-out; }
      .chip-1 { animation: fadeUp 9s infinite 2.6s; }
      .chip-2 { animation: fadeUp 9s infinite 2.85s; }
      .chip-3 { animation: fadeUp 9s infinite 3.1s; }
      .chip-4 { animation: fadeUp 9s infinite 3.35s; }
      .chip-5 { animation: fadeUp 9s infinite 3.6s; }
      .chip-6 { animation: fadeUp 9s infinite 3.85s; }
      .chip-7 { animation: fadeUp 9s infinite 4.1s; }
      .cursor { animation: blink 1.1s infinite; }
      .go { animation: pulse 2.6s infinite; }
    </style>
  </defs>

  <rect class="bg" width="800" height="500" rx="14"/>

  <!-- Top bar -->
  <rect class="panel" x="24" y="24" width="752" height="60" rx="10"/>
  <text class="tick" x="48" y="59" font-size="15">&#9650;</text>
  <text class="lbl" x="72" y="59" font-size="14">AI Stock Analyst</text>
  <rect x="330" y="38" width="240" height="32" rx="8" fill="#211d19" stroke="#3a342d"/>
  <text class="val" x="350" y="59" font-size="14">AAPL</text>
  <rect class="cursor" x="382" y="47" width="2" height="15" fill="#e0ab6d"/>
  <rect class="go" x="588" y="38" width="140" height="32" rx="8" fill="#b8934a"/>
  <text x="658" y="59" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#211d19">Generate report</text>

  <!-- Left: KPI cards -->
  <g class="kpi-1">
    <rect class="panel" x="24" y="104" width="230" height="104" rx="10"/>
    <text class="lbl" x="44" y="132" font-size="12">Intrinsic value (DCF)</text>
    <text class="val" x="44" y="162" font-size="26">$214.50</text>
    <text class="tick" x="44" y="190" font-size="11">margin of safety 12%</text>
  </g>
  <g class="kpi-2">
    <rect class="panel" x="24" y="220" width="230" height="104" rx="10"/>
    <text class="lbl" x="44" y="248" font-size="12">Recommendation</text>
    <text class="val" x="44" y="278" font-size="26">Hold</text>
    <text class="tick" x="44" y="306" font-size="11">consensus: hold</text>
  </g>
  <g class="kpi-3">
    <rect class="panel" x="24" y="336" width="230" height="104" rx="10"/>
    <text class="lbl" x="44" y="364" font-size="12">12-month target</text>
    <text class="val" x="44" y="394" font-size="26">$238</text>
    <text class="tick" x="44" y="422" font-size="11">VaR 95% &#183; beta 1.2</text>
  </g>

  <!-- Right: price chart -->
  <rect class="panel" x="274" y="104" width="502" height="336" rx="10"/>
  <text class="lbl" x="294" y="132" font-size="12">Price history · 1 year</text>
  <g>
    <path class="area" d="M294,380 L334,344 L374,358 L414,320 L454,332 L494,292 L534,306 L574,268 L614,282 L654,240 L694,254 L734,214 L752,232 L752,420 L294,420 Z" fill="url(#area)"/>
    <path class="line" d="M294,380 L334,344 L374,358 L414,320 L454,332 L494,292 L534,306 L574,268 L614,282 L654,240 L694,254 L734,214 L752,232" fill="none" stroke="#b8934a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="752" cy="232" r="4" fill="#e0ab6d"/>
  </g>
  <line x1="294" y1="420" x2="752" y2="420" stroke="#3a342d" stroke-width="1.5"/>
  <text class="lbl" x="294" y="436" font-size="11">12 mo ago</text>
  <text class="lbl" x="720" y="436" font-size="11">today</text>

  <!-- Bottom: 7 agent chips -->
  <g class="chip-1"><rect x="24" y="458" width="104" height="28" rx="14" fill="#2b2621" stroke="#3a342d"/><text x="76" y="476" text-anchor="middle" font-size="11" class="lbl">Company</text></g>
  <g class="chip-2"><rect x="136" y="458" width="86" height="28" rx="14" fill="#2b2621" stroke="#3a342d"/><text x="179" y="476" text-anchor="middle" font-size="11" class="lbl">Macro</text></g>
  <g class="chip-3"><rect x="230" y="458" width="112" height="28" rx="14" fill="#2b2621" stroke="#3a342d"/><text x="286" y="476" text-anchor="middle" font-size="11" class="lbl">Competition</text></g>
  <g class="chip-4"><rect x="350" y="458" width="86" height="28" rx="14" fill="#2b2621" stroke="#3a342d"/><text x="393" y="476" text-anchor="middle" font-size="11" class="lbl">News</text></g>
  <g class="chip-5"><rect x="444" y="458" width="102" height="28" rx="14" fill="#2b2621" stroke="#3a342d"/><text x="495" y="476" text-anchor="middle" font-size="11" class="lbl">Industry</text></g>
  <g class="chip-6"><rect x="554" y="458" width="112" height="28" rx="14" fill="#2b2621" stroke="#3a342d"/><text x="610" y="476" text-anchor="middle" font-size="11" class="lbl">Performance</text></g>
  <g class="chip-7"><rect x="674" y="458" width="102" height="28" rx="14" fill="#b8934a" stroke="#b8934a"/><text x="725" y="476" text-anchor="middle" font-size="11" fill="#211d19">Risks</text></g>
</svg>
